name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      # Dummy secret so Rails boots in CI without credentials.
      SECRET_KEY_BASE: "ci-secret-key-base-not-for-production"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run RSpec (unit / request; skip regtest & system)
        run: >
          bundle exec rspec
          --exclude-pattern 'spec/{system,integration}/**/*_spec.rb'
          --tag '~regtest'
          --tag '~rgb_lib'
          --tag '~demo_flow'
          --tag '~l1_integration'
          --format progress
