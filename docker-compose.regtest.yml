# Bitcoin Core regtest for M1 multisig integration tests.
# Usage: docker compose -f docker-compose.regtest.yml up -d
# RGB stack (electrs + proxy): always started by ./bin/regtest up
# RGB Lightning Nodes (one per demo user + issuer): profile rgb, ports 3001-3005

# Shared config for every RGB Lightning Node container. Each node uses the same
# internal ports (daemon 3001, peer 9735) and the shared regtest services; host
# port mapping disambiguates them. Built once from the vendored submodule.
x-rln-common: &rln-common
  profiles: [rgb]
  build:
    context: .
    dockerfile: docker/rln.Dockerfile
  image: eur-token-rln:local
  restart: unless-stopped
  depends_on:
    bitcoind:
      condition: service_healthy
    electrs:
      condition: service_started
    rgb-proxy:
      condition: service_started

services:
  bitcoind:
    image: bitcoin/bitcoin:28.0
    command:
      - -regtest=1
      - -server=1
      - -fallbackfee=0.0002
      - -txindex=1
      - -rpcbind=0.0.0.0:18443
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=regtest
      - -rpcpassword=regtest
    ports:
      - "18443:18443"
    healthcheck:
      test:
        [
          "CMD",
          "bitcoin-cli",
          "-regtest",
          "-rpcconnect=127.0.0.1",
          "-rpcuser=regtest",
          "-rpcpassword=regtest",
          "getblockchaininfo"
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  electrs:
    profiles: [rgb]
    image: registry.gitlab.com/hashbeam/docker/electrs:0.10.10
    depends_on:
      bitcoind:
        condition: service_healthy
    environment:
      # hashbeam/electrs image (start-electrs.sh) — not APP_BITCOIN_*.
      BTCHOST: bitcoind
      BTCRPCPORT: 18443
      BTCP2PPORT: 18444
      BTCUSER: regtest
      BTCPASS: regtest
      PORT: 50001
      NETWORK: regtest
    ports:
      - "50001:50001"

  rgb-proxy:
    profiles: [rgb]
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    # No host port: RLN nodes reach rgb-proxy:3000 on the compose network only.
    # Exposing 3000 here conflicted with Rails (bin/dev).

  rln-alice:
    <<: *rln-common
    command: ["/data", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports:
      - "3001:3001"
      - "9735:9735"

  rln-bob:
    <<: *rln-common
    command: ["/data", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports:
      - "3002:3001"
      - "9736:9735"

  rln-claude:
    <<: *rln-common
    command: ["/data", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports:
      - "3003:3001"
      - "9737:9735"

  rln-david:
    <<: *rln-common
    command: ["/data", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports:
      - "3004:3001"
      - "9738:9735"

  rln-issuer:
    <<: *rln-common
    command: ["/data", "--daemon-listening-port", "3001", "--ldk-peer-listening-port", "9735", "--network", "regtest", "--disable-authentication"]
    ports:
      - "3005:3001"
      - "9739:9735"
