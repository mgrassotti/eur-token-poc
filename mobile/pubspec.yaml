name: mat_mobile
description: MAT mobile shell — Phase 1 Flutter app against the relay API.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.20.2
  provider: ^6.1.2
  go_router: ^14.6.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3
  share_plus: ^13.2.1
  path_provider: ^2.1.5
  mat_sdk:
    path: packages/mat_sdk
  mat_dlc:
    path: packages/mat_dlc
  # Phase 2 — L1 wallet on device (BDK integration).
  bdk_flutter: ^0.31.3
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
